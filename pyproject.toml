[project]
name = "dravenpdf"
version = "0.1.0.dev0"
description = "HTML to PDF conversion and PDF tools for Python, powered by headless Chromium, with an optional HTTP service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Kryon Consulting" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "playwright>=1.45",
    "pikepdf>=9.0",
    "pypdfium2>=4.30",
    "img2pdf>=0.5",
    "pillow>=10.0",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "typer>=0.12",
    "tzdata>=2024.1",
]

[project.scripts]
dravenpdf = "dravenpdf.cli:main"

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
    "deptry>=0.25.1",
    "websockets>=12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dravenpdf"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
# Code blocks in docs are illustrative; keep their hand layout.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls
    "PT",       # pytest style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "ASYNC110"]

# ---------------------------------------------------------------- deptry
[tool.deptry.per_rule_ignores]
DEP002 = [
    "python-multipart",  # FastAPI imports it to parse form uploads
    "tzdata",            # zoneinfo reads it when the OS has no time zone database
]
DEP003 = ["starlette"]         # FastAPI's own dependency; it pins the version

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["img2pdf.*", "pypdfium2.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "browser: needs a real Chromium (run `playwright install chromium` first)",
]
filterwarnings = [
    # Starlette's TestClient still uses httpx; nothing for us to change.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
