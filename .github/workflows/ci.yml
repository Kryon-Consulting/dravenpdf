name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not browser"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dravenpdf .
      - name: Smoke test the image
        run: |
          docker run -d --init --name dravenpdf -p 8000:8000 -e DRAVENPDF_API_KEY=ci dravenpdf
          for i in $(seq 1 30); do curl -sf localhost:8000/readyz && break; sleep 2; done
          curl -sf -X POST localhost:8000/v1/render/html \
            -H "X-API-Key: ci" -H "Content-Type: application/json" \
            -d '{"html":"<h1>smoke</h1>"}' -o out.pdf
          head -c 5 out.pdf | grep -q '%PDF-'
      - if: failure()
        run: docker logs dravenpdf
